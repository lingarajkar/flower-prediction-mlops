name: CI- Train and Save the model

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  matrix-pip:
    name: Train and Save the model
  runs-on: ubuntu-latest
  strategy:
    matrix:
      python: [3.11, 3.12]
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup python
        uses: actions/setup-python@v4
        with:
          python-versions: ${{ matrix.python }}
      
      - name: Upgrade pip
        run: python -m pip install --upgraded pip setuptools wheel
      
      - name: Install project dependencies
        run: puthon -m pip install -r requirements.txt
      
      - name: Train the model
        run: |
          python train.py
          ls -la artifacts
      
      - name: Upload artifacts
        uses: actions/upload-artifacts
        with:
          name: ml-artifacts-${{ matrix.python }}=${{ github_id }}
          path: artifacts